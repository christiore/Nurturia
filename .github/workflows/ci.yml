name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (couleurs, espacement, motifs interdits, chaînes en dur)
        run: npm run lint

      - name: Vérification des types (strict, noUncheckedIndexedAccess)
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci
